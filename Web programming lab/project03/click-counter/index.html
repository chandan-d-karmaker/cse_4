<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Click Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h2>Counter</h2>
        <h1 id="count">0</h1>
        <button onclick="updateCount(1)">+</button>
        <button onclick="updateCount(-1)">-</button>
        <button onclick="resetCount()">Reset</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
